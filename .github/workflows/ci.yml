name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEMRA/software/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bemra_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BEMRA_SKIP_ENV_FILE: "1" # never read a developer .env in CI
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: bemra_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BEMRA/software/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test # unit + integration (migrates the CI database itself)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEMRA/software/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BEMRA/software/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BEMRA/edge-gateway-esp32-lilygo/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Smoke test: the simulator must start and emit ThingSet live reports without hardware.
      - run: timeout 5 python -u thingset_bms_sim.py --dry-run --interval 1 | tee out.txt || true
      - run: grep -q '#mLive {"Meas":' out.txt
